<body>
    <script>
        function numhijos()
        {
            var num;
            var opcion = prompt("¿Cuantos hijos?");

            if (opcion == null || opcion == "") {
                num = "No has introducidod una cantidad valida"
            } else {
                num = opcion + " Hijos";
            }

            alert(num);
        }

        numhijos();
    </script>
