<body>
<script>
    function calcular() {
        var sueldo = Number(prompt("Indica el sueldo que tiene"));
        var anio = Number(prompt("Indica los años de antigüedad"));
        var sueldofinal;

        if (anio >= 10 && sueldo < 750) {
            sueldofinal = sueldo * 1.10;
        } else if (anio >= 10 && sueldo >= 750) {
            sueldofinal = sueldo * 1.05;
        } else {
            sueldofinal = sueldo;
        }

        alert("Su sueldo final es: " + sueldofinal);
    }

    calcular();
</script>
</body>
</html>
