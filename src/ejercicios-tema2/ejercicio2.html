<body>
    <script>
        function paroimpar() {
            var numero = prompt("Indica un numero para saber si es par o impar");
            if ((numero % 2) == 0) {
                alert(numero + " es un numero par");
            } else {
                alert(numero + " es un numero impar");
            }
        }
        paroimpar();
    </script>
</body>
</html>
