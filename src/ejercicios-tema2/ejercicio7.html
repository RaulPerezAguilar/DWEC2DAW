<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio7</title>
</head>
<body>
    <script>
        function factorial() {
            var suma = 1;
            var numero = prompt("Indique el numero a hacer factorial")
            while (numero > 0) {
                suma = suma * numero;
                numero--;
            }
            alert("El factorial de es " + suma);
        }
        factorial()
    </script>
</body>
</html>
